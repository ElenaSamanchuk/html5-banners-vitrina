      html, body {

        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;

      #click_area {
        position: relative;
        display: block;
        width: 300px;
        height: 250px;
        overflow: hidden;
        cursor: pointer;
        text-decoration: none;
        background: #00b923;
      }

        position: absolute;
        left: 10.5px;
        top: 0;
        width: 280px;
        height: 250px;
      }

      .model {
        position: absolute;
        left: 159.69px;
        top: 17.24px;
        width: 144.74px;
        height: 215.76px;
        object-fit: contain;
      }

      .footer-gradient {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: auto;
      }

      .logo { position: absolute; left: 23.5px; top: 15.64px; width: 93px; height: 24px; }
      .offer {
        position: absolute;
        left: 136.86px;
        top: 14.53px;
        width: 81.85px;
        height: 58.93px;
        transform-origin: 50% 50%;
        animation: offerShake 11s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
        z-index: 2;
      }
      .preheader { position: absolute; left: 23.5px; top: 42.69px; width: 128px; height: 36px; z-index: 3; }
      .hero { position: absolute; left: 23.5px; top: 131.48px; width: 252px; height: 46px; }
      .cta {
        position: absolute;
        left: 23.5px;
        top: 190px;
        width: 253px;
        height: 43px;
        transform-origin: 50% 50%;
        animation: ctaPulse 2.2s ease-in-out infinite alternate;
      }

      .countdown {
        position: absolute;
        left: 23.5px;
        top: 79.48px;
        display: flex;
        gap: 0;
      }

      .count-number-box,
      .count-label-box {
        height: 44.064px;
        border-radius: 8.929px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .count-number-box {
        width: 49.463px;
        background: url("../assets/count-bg-number.svg") 0 0 / 100% 100% no-repeat;
      }

      .count-label-box {
        width: 88px;
        margin-left: -3px;
        padding: 0;
        background: url("../assets/count-bg-word.svg") 0 0 / 100% 100% no-repeat;
      }

      .day-digit {
        position: static;
        transform: none;
        color: #0f4128;
        font-family: "Grato Grotesk CY", "Arial Black", Arial, sans-serif;
        font-weight: 700;
        font-size: 25.13px;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        backface-visibility: hidden;
      }

      .day-number {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }

      .digit-slot {
        position: relative;
        width: 0.68em;
        height: 1em;
        overflow: hidden;
      }

      .digit-char {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        line-height: 1;
      }

      .digit-char.is-out {
        animation: digitOut 520ms ease forwards;
      }

      .digit-char.is-in {
        animation: digitIn 520ms ease forwards;
      }


      #daysLabel {
        font-family: "Grato Grotesk CY", sans-serif !important;
        font-weight: 700;
        font-style: normal;
        position: relative;
        top: -3px;
      }

      #daysNumber {
        text-align: center;
        font-family: "Grato Grotesk CY", sans-serif !important;
        font-weight: 700;
        font-style: normal;
        position: relative;
        top: -1px;
      }

      @keyframes ctaPulse {
        from { transform: scale(1); }
        to { transform: scale(1.012); }
      }

      @keyframes offerShake {
        0%, 55%, 100% { transform: rotate(0deg); }
        63% { transform: rotate(-1.4deg); }
        71% { transform: rotate(1.4deg); }
        79% { transform: rotate(-0.9deg); }
        87% { transform: rotate(0.9deg); }
      }

      @keyframes digitOut {
        from {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -130%);
        }
      }

      @keyframes digitIn {
        from {
          opacity: 0;
          transform: translate(-50%, 30%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }

  <body>
    <a id="click_area" href="%link1%" target="_blank" rel="noopener" aria-label="Перейти на сайт GrowFood">
      <img class="ellipse" src="../assets/ellipse.svg" alt="" />
      <img class="model" src="../assets/female-model.png" alt="" />
      <img class="footer-gradient" src="../assets/footer-background.svg" alt="" />
      <img class="logo" src="../assets/logo.svg" alt="GrowFood" />
      <img class="offer" src="../assets/offer.svg" alt="" />
      <img class="preheader" src="../assets/preheader.svg" alt="" />
      <div class="countdown">
        <div class="count-number-box">
          <span class="day-digit day-number" id="daysNumber"></span>
        </div>
        <div class="count-label-box">
          <span class="day-digit" id="daysLabel">дней</span>
        </div>
      </div>
      <img class="hero" src="../assets/pridi-hero-text.svg" alt="" />
      <img class="cta" src="../assets/cta.svg" alt="" />
    </a>
    <script>
      (function () {
        var daysNumberNode = document.getElementById("daysNumber");
        var daysLabelNode = document.getElementById("daysLabel");
        var START_ANIMATION_VALUE = 40;
        var TARGET_SUMMER_DATE = new Date(2026, 5, 1, 0, 0, 0, 0);
        var MS_PER_DAY = 24 * 60 * 60 * 1000;
        var TIMER_STEP_MS = 2000;

        function getRussianDayWord(value) {
          var n = Math.abs(value) % 100;
          var n1 = n % 10;
          if (n > 10 && n < 20) return "дней";
          if (n1 > 1 && n1 < 5) return "дня";
          if (n1 === 1) return "день";
          return "дней";
        }

        function getDigits(value) {
          var normalized = isFinite(value) ? Math.max(0, Math.floor(value)) : START_ANIMATION_VALUE;
          return String(normalized).padStart(2, "0").slice(-2).split("");
        }

        function createDigitNode(value) {
          var node = document.createElement("span");
          node.className = "digit-char";
          node.textContent = value;
          return node;
        }

        function ensureDigitSlots() {
          if (!daysNumberNode) return null;
          var slots = daysNumberNode.querySelectorAll(".digit-slot");
          if (slots.length === 2) return slots;
          daysNumberNode.innerHTML = "";
          for (var i = 0; i < 2; i += 1) {
            var slot = document.createElement("span");
            slot.className = "digit-slot";
            var initial = createDigitNode("0");
            initial.classList.add("is-current");
            slot.appendChild(initial);
            daysNumberNode.appendChild(slot);
          }
          return daysNumberNode.querySelectorAll(".digit-slot");
        }

        function setDays(value, withAnimation) {
          var normalized = isFinite(value) ? Math.max(0, Math.floor(value)) : START_ANIMATION_VALUE;
          var dayWord = getRussianDayWord(normalized);
          var nextDigits = getDigits(normalized);
          var slots = ensureDigitSlots();

          if (slots) {
            for (var i = 0; i < slots.length; i += 1) {
              var slot = slots[i];
              var current = slot.querySelector(".digit-char.is-current");
              var nextValue = nextDigits[i];

              if (!current) {
                var fallback = createDigitNode(nextValue);
                fallback.classList.add("is-current");
                slot.innerHTML = "";
                slot.appendChild(fallback);
                continue;
              }

              if (current.textContent === nextValue) continue;
              if (!withAnimation) {
                current.textContent = nextValue;
                continue;
              }

              var incoming = createDigitNode(nextValue);
              incoming.classList.add("is-in", "is-current");
              current.classList.remove("is-current");
              current.classList.add("is-out");
              slot.appendChild(incoming);

              (function (outNode, inNode) {
                setTimeout(function () {
                  if (outNode && outNode.parentNode) outNode.parentNode.removeChild(outNode);
                  inNode.classList.remove("is-in");
                }, 560);
              })(current, incoming);
            }
          }

          if (daysLabelNode) daysLabelNode.textContent = dayWord;
        }

        function getFullDaysLeftToSummer() {
          var now = new Date();
          return Math.max(0, Math.floor((TARGET_SUMMER_DATE.getTime() - now.getTime()) / MS_PER_DAY));
        }

        function animateDaysValue(fromValue, toValue) {
          var start = Number(fromValue);
          var end = Number(toValue);
          if (!isFinite(start) || !isFinite(end)) {
            setDays(START_ANIMATION_VALUE, false);
            return;
          }
          if (start === end) {
            setDays(end, false);
            return;
          }
          var direction = start < end ? 1 : -1;
          var current = start;
          setDays(current, false);
          var timer = setInterval(function () {
            current += direction;
            setDays(current, true);
            if (current === end) clearInterval(timer);
          }, TIMER_STEP_MS);
        }

        animateDaysValue(START_ANIMATION_VALUE, getFullDaysLeftToSummer());

      })();
    </script>
  </body>
</html>
