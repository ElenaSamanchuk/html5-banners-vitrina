<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Витрина баннеров</title>
    <style>
      :root {
        --bg: #07150d;
        --bg-soft: #10261a;
        --card: #133424;
        --line: #2f6a4c;
        --text: #ecfff2;
        --muted: #b4dbc6;
        --accent: #8bff4f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(820px 520px at 12% 2%, rgba(139, 255, 79, 0.17), transparent 65%),
          radial-gradient(820px 420px at 90% 6%, rgba(40, 197, 113, 0.16), transparent 60%),
          linear-gradient(180deg, var(--bg), #0b2016);
      }
      .container { width: min(1220px, calc(100% - 28px)); margin: 0 auto; }
      header { padding: 28px 0 12px; }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 42px); letter-spacing: -0.02em; }
      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 14px 0;
      }
      .toolbar select {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        background: var(--bg-soft);
        color: var(--text);
        border-radius: 10px;
        padding: 0 12px;
        font-size: 14px;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        margin: 4px 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        padding-bottom: 28px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(170deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
        overflow: hidden;
      }
      .preview {
        min-height: 210px;
        padding: 12px;
        display: grid;
        place-items: center;
        background: #0a1b13;
      }
      .frame {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        background: #000;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      iframe {
        border: 0;
        transform-origin: top left;
        display: block;
      }
      .download {
        margin: 10px;
        height: 40px;
        width: calc(100% - 20px);
        border-radius: 10px;
        border: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(90deg, #7dfb49, #46d18e);
        color: #0b2016;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .empty {
        display: none;
        margin: 20px 0 30px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        text-align: center;
        color: var(--muted);
        padding: 22px;
      }
      @media (max-width: 920px) {
        .toolbar { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>Витрина баннеров</h1>
    </header>
    <main class="container">
      <section class="toolbar">
        <select id="gender"><option value="all">Гендер: все</option></select>
        <select id="platform"><option value="all">Платформа: все</option></select>
        <select id="size"><option value="all">Размер: все</option></select>
        <select id="headline"><option value="all">Заголовок: все</option></select>
      </section>
      <div class="status" id="status">Загрузка...</div>
      <section class="grid" id="grid"></section>
      <div class="empty" id="empty">По выбранным фильтрам баннеров нет.</div>
    </main>

    <script>
      const labels = {
        gender: { f: "ж", m: "м" },
        platform: { vk: "VK", yandex: "Яндекс" },
        headline: {
          soberi: "собери",
          pridi: "приди",
          podtyani: "подтяни",
          siluet: "силуэт",
          forma: "форма"
        }
      };

      const ui = {
        gender: document.getElementById("gender"),
        platform: document.getElementById("platform"),
        size: document.getElementById("size"),
        headline: document.getElementById("headline"),
        grid: document.getElementById("grid"),
        status: document.getElementById("status"),
        empty: document.getElementById("empty")
      };

      const parseFile = (name) => {
        const m = name.match(/^index_(\d+x\d+)_(f|m)_([a-z0-9-]+)_(vk|yandex)\.html$/);
        if (!m) return null;
        const [, size, gender, headline, platform] = m;
        const [width, height] = size.split("x").map(Number);
        return { file: name, size, gender, headline, platform, width, height };
      };

      const addOptions = (select, values, mapper = (v) => v) => {
        values.forEach((value) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = mapper(value);
          select.appendChild(opt);
        });
      };

      const renderCard = (item) => {
        const maxW = 260;
        const maxH = 340;
        const scale = Math.min(maxW / item.width, maxH / item.height, 1);
        const frameW = Math.round(item.width * scale);
        const frameH = Math.round(item.height * scale);

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <a class="preview" href="${item.file}" target="_blank" rel="noopener" title="Открыть баннер">
            <div class="frame" style="width:${frameW}px; height:${frameH}px;">
              <iframe src="${item.file}" loading="lazy" width="${item.width}" height="${item.height}"
                style="transform:scale(${scale}); width:${item.width}px; height:${item.height}px;"></iframe>
            </div>
          </a>
          <a class="download" href="${item.archive}" download>Скачать архив</a>
        `;
        return card;
      };

      const applyFilters = (records) => {
        const g = ui.gender.value;
        const p = ui.platform.value;
        const s = ui.size.value;
        const h = ui.headline.value;

        const filtered = records.filter((r) =>
          (g === "all" || r.gender === g) &&
          (p === "all" || r.platform === p) &&
          (s === "all" || r.size === s) &&
          (h === "all" || r.headline === h)
        );

        ui.grid.innerHTML = "";
        filtered.forEach((item) => ui.grid.appendChild(renderCard(item)));
        ui.status.textContent = `Показано ${filtered.length} из ${records.length}`;
        ui.empty.style.display = filtered.length ? "none" : "block";
      };

      Promise.all([
        fetch("./banner_manifest.json").then((r) => r.json()),
        fetch("./archives_manifest.json").then((r) => r.json())
      ]).then(([bannerManifest, archiveManifest]) => {
        const archiveMap = new Map(archiveManifest.map((x) => [x.file, x.archive]));
        const records = bannerManifest.copied
          .map(parseFile)
          .filter(Boolean)
          .map((r) => ({ ...r, archive: archiveMap.get(r.file) }))
          .filter((r) => Boolean(r.archive));

        addOptions(ui.gender, [...new Set(records.map((r) => r.gender))], (v) => labels.gender[v] || v);
        addOptions(ui.platform, [...new Set(records.map((r) => r.platform))], (v) => labels.platform[v] || v);
        addOptions(ui.size, [...new Set(records.map((r) => r.size))].sort());
        addOptions(ui.headline, [...new Set(records.map((r) => r.headline))], (v) => labels.headline[v] || v);

        [ui.gender, ui.platform, ui.size, ui.headline].forEach((el) => {
          el.addEventListener("change", () => applyFilters(records));
        });

        applyFilters(records);
      }).catch(() => {
        ui.status.textContent = "Ошибка загрузки данных витрины.";
      });
    </script>
  </body>
</html>
