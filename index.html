<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Витрина баннеров</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f4f7f5;
        --card: #ffffff;
        --line: #d9e3dc;
        --text: #14221a;
        --muted: #66756d;
        --button: #00b923;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .container { width: min(1220px, calc(100% - 28px)); margin: 0 auto; }
      header { padding: 28px 0 12px; }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 42px); letter-spacing: -0.02em; }
      .toolbar {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin: 14px 0;
      }
      .toolbar select,
      .toolbar button {
        width: 100%;
        height: 44px;
        border: 1px solid var(--line);
        background: var(--bg-soft);
        color: var(--text);
        border-radius: 10px;
        padding: 0 12px;
        font-size: 14px;
      }
      .toolbar button {
        cursor: pointer;
        background: #fff;
        font-weight: 600;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        margin: 4px 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        padding-bottom: 28px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        overflow: hidden;
      }
      .preview {
        min-height: 210px;
        padding: 12px;
        display: grid;
        place-items: center;
        background: #f7f9f8;
      }
      .frame {
        border: 1px solid #d7dfda;
        border-radius: 10px;
        background: #000;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      iframe {
        border: 0;
        transform-origin: top left;
        display: block;
      }
      .download {
        margin: 10px;
        height: 40px;
        width: calc(100% - 20px);
        border-radius: 10px;
        border: 0;
        display: grid;
        place-items: center;
        background: var(--button);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .empty {
        display: none;
        margin: 20px 0 30px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        text-align: center;
        color: var(--muted);
        padding: 22px;
      }
      @media (max-width: 920px) {
        .toolbar { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>Витрина баннеров</h1>
    </header>
    <main class="container">
      <section class="toolbar">
        <select id="gender"><option value="all">Гендер: все</option></select>
        <select id="platform"><option value="all">Платформа: все</option></select>
        <select id="size"><option value="all">Размер: все</option></select>
        <select id="headline"><option value="all">Заголовок: все</option></select>
        <button id="resetFilters" type="button">Сбросить фильтры</button>
      </section>
      <div class="status" id="status">Загрузка...</div>
      <section class="grid" id="grid"></section>
      <div class="empty" id="empty">По выбранным фильтрам баннеров нет.</div>
    </main>

    <script>
      const labels = {
        gender: { f: "женщина", m: "мужчина" },
        platform: { vk: "VK", yandex: "Яндекс" },
        headline: {
          kubiki: "собери свои кубики на системе GF",
          siluet_m: "прокачай силуэт к пляжному сезону вместе с Grow Food",
          relief: "рельеф к лету это про питание, не только про зал",
          forma: "собери свою форму на системе питания Grow Food",
          pridi: "приди в форму, о которой мечтала вместе с системой Grow Food",
          podtyani: "подтяни силуэт на системе питания Grow Food",
          siluet_f: "стройный силуэт это система, а не диета"
        },
        size: {
          "300x250": "300×250",
          "300x300": "300×300",
          "300x500": "300×500",
          "320x480": "320×480",
          "336x280": "336×280",
          "240x400": "240×400",
          "300x600": "300×600"
        }
      };

      const ui = {
        gender: document.getElementById("gender"),
        platform: document.getElementById("platform"),
        size: document.getElementById("size"),
        headline: document.getElementById("headline"),
        reset: document.getElementById("resetFilters"),
        grid: document.getElementById("grid"),
        status: document.getElementById("status"),
        empty: document.getElementById("empty")
      };

      const parseFile = (name) => {
        const m = name.match(/^index_(\d+x\d+)_(f|m)_([a-z0-9-]+)_(vk|yandex)\.html$/);
        if (m) {
          const [, size, gender, headline, platform] = m;
          const [width, height] = size.split("x").map(Number);
          const headlineKey = headline === "siluet" && gender === "f" ? "siluet_f" : headline;
          return { file: name, size, gender, headline, headlineKey, platform, width, height };
        }

        const mMale = name.match(/^index_(\d+x\d+)_(kubiki|relief|siluet)\.html$/);
        if (mMale) {
          const [, size, headline] = mMale;
          const [width, height] = size.split("x").map(Number);
          const headlineKey = headline === "siluet" ? "siluet_m" : headline;
          return { file: name, size, gender: "m", headline, headlineKey, platform: "yandex", width, height };
        }

        const mSingle = name.match(/^index_(relief|siluet)\.html$/);
        if (mSingle) {
          const headline = mSingle[1];
          const headlineKey = headline === "siluet" ? "siluet_m" : "relief";
          return { file: name, size: "300x250", gender: "m", headline, headlineKey, platform: "yandex", width: 300, height: 250 };
        }

        return null;
      };

      const addOptions = (select, values, mapper = (v) => v) => {
        values.forEach((value) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = mapper(value);
          select.appendChild(opt);
        });
      };

      const renderCard = (item) => {
        const maxW = 260;
        const maxH = 340;
        const scale = Math.min(maxW / item.width, maxH / item.height, 1);
        const frameW = Math.round(item.width * scale);
        const frameH = Math.round(item.height * scale);

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <a class="preview" href="${item.file}" target="_blank" rel="noopener" title="Открыть баннер">
            <div class="frame" style="width:${frameW}px; height:${frameH}px;">
              <iframe src="${item.file}" width="${item.width}" height="${item.height}"
                style="transform:scale(${scale}); width:${item.width}px; height:${item.height}px;"></iframe>
            </div>
          </a>
          <a class="download" href="${item.archive}" download>Скачать архив</a>
        `;
        return card;
      };

      const applyFilters = (records) => {
        const g = ui.gender.value;
        const p = ui.platform.value;
        const s = ui.size.value;
        const h = ui.headline.value;

        const filtered = records.filter((r) =>
          (g === "all" || r.gender === g) &&
          (p === "all" || r.platform === p) &&
          (s === "all" || r.size === s) &&
          (h === "all" || r.headlineKey === h)
        );

        ui.grid.innerHTML = "";
        filtered.forEach((item) => ui.grid.appendChild(renderCard(item)));
        ui.status.textContent = `Показано ${filtered.length} из ${records.length}`;
        ui.empty.style.display = filtered.length ? "none" : "block";
      };

      fetch("./archives_manifest.json").then((r) => r.json()).then((archiveManifest) => {
        const records = archiveManifest
          .map((x) => parseFile(x.file))
          .filter(Boolean)
          .map((r) => {
            const archiveEntry = archiveManifest.find((x) => x.file === r.file);
            return { ...r, archive: archiveEntry ? archiveEntry.archive : "" };
          })
          .filter((r) => Boolean(r.archive));

        const expectedSizes = ["300x250", "300x300", "300x500", "320x480", "336x280", "240x400", "300x600"];
        const foundSizes = new Set(records.map((r) => r.size));
        const missingSizes = expectedSizes.filter((s) => !foundSizes.has(s));
        const expectedHeadlines = ["kubiki", "siluet_m", "relief", "forma", "pridi", "podtyani", "siluet_f"];
        const foundHeadlines = new Set(records.map((r) => r.headlineKey));
        const missingHeadlines = expectedHeadlines.filter((h) => !foundHeadlines.has(h));

        addOptions(ui.gender, ["f", "m"], (v) => labels.gender[v] || v);
        addOptions(ui.platform, ["yandex", "vk"], (v) => labels.platform[v] || v);
        addOptions(ui.size, expectedSizes.filter((s) => foundSizes.has(s)), (v) => labels.size[v] || v);
        addOptions(ui.headline, expectedHeadlines.filter((h) => foundHeadlines.has(h)), (v) => labels.headline[v] || v);

        [ui.gender, ui.platform, ui.size, ui.headline].forEach((el) => {
          el.addEventListener("change", () => applyFilters(records));
        });
        ui.reset.addEventListener("click", () => {
          ui.gender.value = "all";
          ui.platform.value = "all";
          ui.size.value = "all";
          ui.headline.value = "all";
          applyFilters(records);
        });

        applyFilters(records);
        if (missingSizes.length || missingHeadlines.length) {
          const extra = [];
          if (missingSizes.length) extra.push("размеры: " + missingSizes.map((s) => labels.size[s] || s).join(", "));
          if (missingHeadlines.length) extra.push("заголовки: " + missingHeadlines.map((h) => labels.headline[h] || h).join("; "));
          ui.status.textContent += " | отсутствуют: " + extra.join(" | ");
        }
      }).catch(() => {
        ui.status.textContent = "Ошибка загрузки данных витрины.";
      });
    </script>
  </body>
</html>
